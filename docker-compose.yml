# Entorno local EP2: Kafka (KRaft, sin ZooKeeper) + PostgreSQL + Kafka UI.
# Replica la configuración del broker en EC2 (infra/kafka-ec2/docker-compose.yml):
#   - INTERNAL  (PLAINTEXT, 29092): solo dentro de la red de Docker (Kafka UI, scripts de administración)
#   - EXTERNAL  (SASL_PLAINTEXT + SCRAM-SHA-512, 9092): clientes externos (Spring Boot, scraper)
#   - CONTROLLER (9093): quórum KRaft
# Uso: cp .env.example .env && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: cometranqui-postgres
    environment:
      POSTGRES_DB: cometranqui
      POSTGRES_USER: ${DB_USER:-cometranqui}
      POSTGRES_PASSWORD: ${DB_PASS:-cometranqui}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cometranqui} -d cometranqui"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: cometranqui-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: cometranqui-local-kraft-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # listener.name.external.scram-sha-512.sasl.jaas.config  ("___" = "-" en la imagen apache/kafka)
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      retries: 20

  # Tarea única: crea el usuario SCRAM y los topics (idempotente).
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: cometranqui-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_USER: ${KAFKA_USER:-cometranqui}
      KAFKA_PASS: ${KAFKA_PASS:-cometranqui-local}
      BOOTSTRAP: kafka:29092
    volumes:
      - ./infra/kafka-topics.sh:/scripts/kafka-topics.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter \
          --add-config "SCRAM-SHA-512=[iterations=8192,password=$${KAFKA_PASS}]" \
          --entity-type users --entity-name "$${KAFKA_USER}"
        KAFKA_BIN=/opt/kafka/bin bash /scripts/kafka-topics.sh
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cometranqui-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cometranqui-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  pgdata:
  kafkadata:
