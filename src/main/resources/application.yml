server:
  port: ${PORT:8080}

spring:
  application:
    name: cometranqui-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

app:
  security:
    cognito-client-id: ${COGNITO_CLIENT_ID}
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
